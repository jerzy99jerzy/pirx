name: gate

# Least privilege by default. A public repository accepts pull requests from
# forks; the gate reads code and reports status, and needs nothing else.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Third-party actions are pinned to commit SHAs, not to moving tags. A tag is
# mutable by whoever controls the action's repository, so `@v4` is a standing
# invitation to run someone else's future code in this pipeline. Comments
# record which release each SHA corresponded to when it was pinned.
jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install mypy
      - run: mypy pirx

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: python -m pytest -q
