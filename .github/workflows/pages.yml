name: pages
# Publishes docs/MANUAL.md as the project's GitHub Pages site. The build job
# renders it with tools/build_site.py, which refuses a page that would publish
# wrong (a table row cut short, a link to nothing, a diagram without its
# drawing); the deploy job hands the result to Pages. Threat model PT22 is the
# reason for the shape: the deploy job holds an identity token, and the only
# code beside that token is one first-party action pinned by commit.
# tests/test_workflow_identity.py pins it.
#
# Ported from cve-digest's pages.yml (its threat model T17), restated rather
# than vendored. Before the first run the repository's Pages source must be
# "GitHub Actions" and the github-pages environment must admit main alone;
# docs/MERGE-PROCEDURE.md has the commands that set and read both.
on:
  push:
    branches: [main]
    paths:
      - docs/MANUAL.md
      - docs/site/**
      - docs/assets/pirx-banner.gif
      - tools/build_site.py
      - requirements-docs.txt
      - .github/workflows/pages.yml
  # For the first publish after the source is switched, and for a re-publish
  # with no content change. Off main it builds and stops: the deploy job's
  # condition skips it, and the environment's branch rule would refuse it.
  workflow_dispatch: {}

# Read-only at the workflow level. Each job states what it needs, so a job
# added later inherits neither the right to deploy nor the right to mint a
# token.
permissions:
  contents: read

# One deployment at a time, and never cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions pinned by commit with the release tag as a comment, as in gate.yml,
# whose checkout and setup-python commits these are. The two Pages actions
# were resolved on 2026-10-16 with
# git ls-remote --tags https://github.com/actions/upload-pages-artifact
# git ls-remote --tags https://github.com/actions/deploy-pages
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      # The parser and its one dependency, by hash. The builder imports
      # nothing from the package, so nothing else is installed.
      - run: python -m pip install --require-hashes -r requirements-docs.txt
      - name: Render the manual
        env:
          REF: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: python -m tools.build_site --out _site --ref "$REF" --repository "$REPOSITORY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    # The environment's branch rule says the same thing (PT22); this says it
    # where a reader of the workflow will see it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pages: write creates the deployment. id-token: write mints the token the
    # Pages API checks the deployment's origin with, which is why this job
    # runs no code from this repository and no package from an index.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
