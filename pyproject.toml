[project]
name = "pirx"
version = "0.5.0.0"
description = "Remediation agent whose authority is granted per action, not per session"
requires-python = ">=3.14"

[project.scripts]
pirx = "pirx.cli:main"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = false

[tool.pytest.ini_options]
testpaths = ["tests"]
